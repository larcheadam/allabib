<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- الخلفية العامة الدائرية الخفيفة لأغراض الـ Icon (يمكن إزالتها أو الحفاظ عليها) -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="100"/>

  <g transform="translate(10, 0)" filter="url(#shadow)">
    <!-- أيقونة الطالب المتخرج التجريدية (Abstract Graduating Student) -->
    <!-- الرأس البرتقالي/الذهبي للشخصية الخلفية -->
    <circle cx="280" cy="120" r="22" fill="url(#amberGrad)" />
    <!-- الجسم البرتقالي/الذهبي المرفوع كأنه قبعة أو ذراع تخرج -->
    <path d="M 230 180 C 230 140, 270 140, 290 140 C 310 140, 360 160, 360 210 C 330 250, 300 230, 280 230 C 260 230, 240 210, 230 180 Z" fill="url(#amberGrad)" />

    <!-- الرأس الأزرق للشخصية الأمامية -->
    <circle cx="160" cy="200" r="16" fill="url(#blueGrad)" />
    <!-- الجسم الأزرق للشخصية الأمامية (يمثل قبعة التخرج أو ذراع مرفوع) -->
    <path d="M 120 240 C 120 215, 150 215, 170 215 C 190 215, 220 230, 220 260 C 200 290, 170 280, 160 280 C 145 280, 130 260, 120 240 Z" fill="url(#blueGrad)" />

    <!-- نصوص الشعار باللغتين العربية والفرنسية المصممة بطريقة فنية متناسقة -->
    
    <!-- الكلمة العربية: مؤسسة اللبيب -->
    <!-- استخدام خطوط مدمجة ومحاكاة المخطوط الفني للشعار اللبيب -->
    <text x="250" y="325" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="34" fill="#1E3A8A" text-anchor="middle" letter-spacing="0.5">مؤسسة اللبيب</text>
    
    <!-- الكلمة اللاتينية: ETABLISSEMENT ALLABIB بالذهبي/البرتقالي الداكن -->
    <text x="250" y="365" font-family="'Inter', 'Outfit', sans-serif" font-weight="800" font-size="19" fill="#D97706" text-anchor="middle" letter-spacing="3.5">ETABLISSEMENT ALLABIB</text>
  </g>
</svg>
